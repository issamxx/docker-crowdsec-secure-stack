services:
  web-app:
    image: nginx:1.27-alpine
    container_name: secure-stack-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_net

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: secure-stack-proxy
    restart: unless-stopped
    depends_on:
      - web-app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_net
      - edge_net

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: secure-stack-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
      GID: "${GID:-1000}"
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - nginx_logs:/var/log/nginx:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    security_opt:
      - no-new-privileges:true
    networks:
      - edge_net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: secure-stack-ngrok
    restart: unless-stopped
    depends_on:
      - reverse-proxy
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    networks:
      - edge_net

volumes:
  nginx_logs:
  crowdsec_db:
  crowdsec_config:

networks:
  internal_net:
    driver: bridge
    internal: true
  edge_net:
    driver: bridge
